<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>💕 Sana Özel</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    font-family:
        Arial,
        sans-serif;

    color: white;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            #650b2c 0%,
            #3b0018 35%,
            #150008 75%,
            #080003 100%
        );

    transition:
        background 0.8s ease,
        color 0.8s ease;

}


/* =====================================================
   GÜNDÜZ MODU
===================================================== */

body.day {

    color: #5c1730;

    background:
        radial-gradient(
            circle at 50% 20%,
            #fff0f5 0%,
            #ffd6e3 35%,
            #ffb9ce 70%,
            #ff9fbb 100%
        );

}


/* =====================================================
   GALAKSİ MODU
===================================================== */

body.galaxy {

    background:
        radial-gradient(
            circle at 50% 45%,
            #26105f 0%,
            #12052d 35%,
            #050014 70%,
            #010006 100%
        );

    color: white;

}


body.galaxy.day {

    background:
        radial-gradient(
            circle at 50% 45%,
            #26105f 0%,
            #12052d 35%,
            #050014 70%,
            #010006 100%
        );

    color: white;

}


/* =====================================================
   IŞIKLAR
===================================================== */

.glow {

    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .18;

    pointer-events: none;

    animation:
        glowMove
        8s
        ease-in-out
        infinite
        alternate;

    z-index: 0;

}

.glow.one {

    background: #ff174f;

    top: -100px;
    left: -100px;

}

.glow.two {

    background: #5c4dff;

    right: -100px;
    bottom: -100px;

    animation-delay: 2s;

}

@keyframes glowMove {

    0% {
        transform: translate(0,0);
    }

    100% {
        transform: translate(100px,-60px);
    }

}


/* =====================================================
   BUTONLAR
===================================================== */

.theme-btn,
.galaxy-btn {

    position: fixed;

    width: 55px;
    height: 55px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,77,109,.2);

    backdrop-filter:
        blur(10px);

    border:
        1px solid
        rgba(255,150,170,.3);

    color: white;

    font-size: 25px;

    cursor: pointer;

    z-index: 999;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.3);

    transition:
        transform .2s ease,
        background .3s ease;

}

.theme-btn {

    top: 18px;
    right: 18px;

}

.galaxy-btn {

    top: 18px;
    left: 18px;

}

.theme-btn:hover,
.galaxy-btn:hover {

    transform:
        scale(1.1)
        rotate(10deg);

}


body.day:not(.galaxy)
.theme-btn {

    background:
        rgba(255,255,255,.55);

    color:
        #ff4d6d;

}


/* =====================================================
   GALAKSİ BUTONU AKTİF
===================================================== */

body.galaxy .galaxy-btn {

    background:
        linear-gradient(
            135deg,
            #632cff,
            #168cff
        );

    box-shadow:
        0 0 25px
        rgba(80,100,255,.7);

}


/* =====================================================
   GALAKSİ YILDIZLARI
===================================================== */

.space-star {

    position: fixed;

    color: white;

    pointer-events: none;

    z-index: 1;

    animation:
        starTwinkle
        2s
        ease-in-out
        infinite
        alternate;

}

@keyframes starTwinkle {

    from {

        opacity: .2;

        transform:
            scale(.7)
            rotate(0deg);

    }

    to {

        opacity: 1;

        transform:
            scale(1.4)
            rotate(180deg);

    }

}


/* =====================================================
   GEZEGEN
===================================================== */

.planet {

    position: fixed;

    border-radius: 50%;

    pointer-events: none;

    z-index: 1;

    box-shadow:
        inset
        -15px
        -15px
        30px
        rgba(0,0,0,.5),
        0 0 25px
        rgba(120,100,255,.5);

    animation:
        planetFloat
        7s
        ease-in-out
        infinite
        alternate;

}

@keyframes planetFloat {

    from {

        transform:
            translateY(0)
            rotate(0deg);

    }

    to {

        transform:
            translateY(-30px)
            rotate(20deg);

    }

}


/* =====================================================
   SAYFA
===================================================== */

.page {

    position: relative;

    z-index: 5;

    width: 100%;

    height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding:
        25px 15px;

}


h1 {

    margin:
        5px 0 4px;

    color:
        #ff9caf;

    font-size:
        clamp(30px,7vw,48px);

    text-align:
        center;

    text-shadow:
        0 0 25px
        rgba(255,77,109,.5);

    animation:
        titlePulse
        3s
        ease-in-out
        infinite;

}


body.day:not(.galaxy) h1 {

    color:
        #e73568;

}


body.galaxy h1 {

    color:
        #c5b6ff;

    text-shadow:
        0 0 20px
        #734dff,
        0 0 45px
        #168cff;

}


@keyframes titlePulse {

    0%,
    100% {

        text-shadow:
            0 0 15px
            rgba(255,77,109,.35);

    }

    50% {

        text-shadow:
            0 0 35px
            rgba(255,77,109,.8);

    }

}


.subtitle {

    color:
        #d493a5;

    text-align:
        center;

    margin-bottom:
        12px;

    font-size:
        14px;

}


body.galaxy .subtitle {

    color:
        #a89bd6;

}


/* =====================================================
   OYUN
===================================================== */

.game {

    position: relative;

    width:
        min(900px,100%);

    flex: 1;

    max-height:
        700px;

    border-radius:
        30px;

    border:
        1px solid
        rgba(255,100,130,.18);

    background:
        rgba(20,0,10,.45);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.45);

    overflow:
        hidden;

    transition:
        background .8s ease,
        border .8s ease,
        box-shadow .8s ease;

}


body.day:not(.galaxy) .game {

    background:
        rgba(255,245,248,.65);

    border:
        1px solid
        rgba(255,80,130,.25);

}


body.galaxy .game {

    background:
        rgba(5,0,25,.35);

    border:
        1px solid
        rgba(130,100,255,.3);

    box-shadow:
        0 0 70px
        rgba(70,30,180,.3);

}


/* =====================================================
   TOP ETİKETİ
===================================================== */

.badge {

    position: absolute;

    top: 18px;

    left: 50%;

    transform:
        translateX(-50%);

    padding:
        8px 16px;

    border-radius:
        50px;

    background:
        rgba(255,77,109,.12);

    border:
        1px solid
        rgba(255,143,163,.18);

    color:
        #ff9caf;

    font-size:
        13px;

    z-index:
        30;

    white-space:
        nowrap;

}


body.galaxy .badge {

    color:
        #bdaaff;

    background:
        rgba(110,70,255,.15);

    border-color:
        rgba(140,120,255,.3);

}


/* =====================================================
   TOP ALANI
===================================================== */

.ball-wrap {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        270px;

    height:
        270px;

    transform:
        translate(-50%,-50%);

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    z-index:
        10;

}


/* =====================================================
   ANA TOP
===================================================== */

.ball {

    position: relative;

    width:
        205px;

    height:
        205px;

    border-radius:
        50%;

    cursor:
        pointer;

    touch-action:
        none;

    user-select:
        none;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        58px;

    transition:
        transform .15s ease,
        background .5s ease,
        box-shadow .5s ease;

}


/* =====================================================
   1 - KALP TOPU
===================================================== */

.ball.heart-ball {

    background:

        radial-gradient(
            circle at 30% 22%,
            #ffc0cc 0%,
            #ff708d 20%,
            #ff3d67 48%,
            #d3194d 75%,
            #79001f 100%
        );

    box-shadow:

        inset
        20px 15px 30px
        rgba(255,255,255,.2),

        inset
        -25px -30px 40px
        rgba(70,0,20,.5),

        0 25px 50px
        rgba(0,0,0,.5);

}


/* =====================================================
   2 - BUZ TOPU
===================================================== */

.ball.ice-ball {

    background:

        radial-gradient(
            circle at 30% 20%,
            #ffffff 0%,
            #a9f4ff 18%,
            #42d8ff 45%,
            #1884e8 75%,
            #063c94 100%
        );

    box-shadow:

        inset
        20px 15px 30px
        rgba(255,255,255,.5),

        inset
        -25px -30px 40px
        rgba(0,40,120,.5),

        0 0 35px
        rgba(40,200,255,.6),

        0 25px 50px
        rgba(0,0,0,.5);

}


/* =====================================================
   3 - GALAKSİ TOPU
===================================================== */

.ball.galaxy-ball {

    background:

        radial-gradient(
            circle at 50% 45%,
            #ff8df8 0%,
            #a83cff 18%,
            #5920d6 40%,
            #20105c 68%,
            #07001b 100%
        );

    box-shadow:

        inset
        10px 10px 35px
        rgba(255,255,255,.25),

        0 0 35px
        rgba(130,70,255,.8),

        0 0 70px
        rgba(50,120,255,.4),

        0 25px 50px
        rgba(0,0,0,.6);

}


/* =====================================================
   4 - GÖKKUŞAĞI TOPU
===================================================== */

.ball.rainbow-ball {

    background:

        conic-gradient(
            #ff4d6d,
            #ff9f43,
            #ffe66d,
            #55efc4,
            #48dbfb,
            #7d5fff,
            #ff4d6d
        );

    box-shadow:

        inset
        15px 15px 35px
        rgba(255,255,255,.3),

        0 0 40px
        rgba(255,100,200,.6),

        0 25px 50px
        rgba(0,0,0,.5);

    animation:
        rainbowSpin
        6s
        linear
        infinite;

}


@keyframes rainbowSpin {

    from {

        filter:
            hue-rotate(0deg);

    }

    to {

        filter:
            hue-rotate(360deg);

    }

}


/* =====================================================
   5 - YILDIZ TOPU
===================================================== */

.ball.star-ball {

    background:

        radial-gradient(
            circle at 30% 25%,
            #ffffff,
            #ffe875 12%,
            #ffb300 30%,
            #ff6b00 55%,
            #7d1800 100%
        );

    box-shadow:

        inset
        15px 15px 35px
        rgba(255,255,255,.45),

        0 0 35px
        #ffb300,

        0 0 70px
        rgba(255,130,0,.4),

        0 25px 50px
        rgba(0,0,0,.5);

}


/* =====================================================
   TOP PARÇASI
===================================================== */

.ball::before {

    content: "";

    position: absolute;

    width:
        50px;

    height:
        25px;

    background:
        rgba(255,255,255,.3);

    border-radius:
        50%;

    top:
        25px;

    left:
        38px;

    transform:
        rotate(-25deg);

    filter:
        blur(5px);

}


/* =====================================================
   TOP EZİLME
===================================================== */

.ball.pressed {

    transform:
        scale(1.15,.72);

}


/* =====================================================
   TOP SALLANMA
===================================================== */

.ball.shake {

    animation:
        shake
        .35s
        linear
        infinite;

}


@keyframes shake {

    0% {
        margin-left:-3px;
    }

    25% {
        margin-left:3px;
    }

    50% {
        margin-left:-4px;
    }

    75% {
        margin-left:4px;
    }

    100% {
        margin-left:0;
    }

}


/* =====================================================
   TOP PATLAMA
===================================================== */

.ball.pop {

    animation:
        pop
        .55s
        ease
        forwards;

}


@keyframes pop {

    0% {

        transform:
            scale(1,.75);

    }

    30% {

        transform:
            scale(1.35,.55);

    }

    55% {

        transform:
            scale(.8);

        opacity:.8;

    }

    100% {

        transform:
            scale(0);

        opacity:0;

    }

}


/* =====================================================
   TOP İSMİ
===================================================== */

.ball-name {

    position: absolute;

    bottom:
        25px;

    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.9);

    font-weight:
        bold;

    font-size:
        14px;

    z-index:
        40;

    text-shadow:
        0 2px 8px #0008;

}


/* =====================================================
   EFEKT YAZISI
===================================================== */

.effect-text {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%)
        scale(0);

    font-size:
        clamp(35px,8vw,70px);

    font-weight:
        900;

    text-align:
        center;

    white-space:
        nowrap;

    pointer-events:
        none;

    z-index:
        90;

}


.effect-text.show {

    animation:
        effectText
        .9s
        ease
        forwards;

}


@keyframes effectText {

    0% {

        transform:
            translate(-50%,-50%)
            scale(0)
            rotate(-15deg);

        opacity:0;

    }

    25% {

        transform:
            translate(-50%,-50%)
            scale(1.25)
            rotate(8deg);

        opacity:1;

    }

    70% {

        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(0);

        opacity:1;

    }

    100% {

        transform:
            translate(-50%,-50%)
            scale(1.5);

        opacity:0;

    }

}


/* =====================================================
   KALPLER
===================================================== */

.heart {

    position:absolute;

    left:50%;
    top:50%;

    font-size:30px;

    cursor:pointer;

    z-index:70;

    user-select:none;

    animation:
        flyHeart
        1.4s
        cubic-bezier(.1,.75,.2,1)
        forwards;

    filter:
        drop-shadow(
            0 5px 7px
            rgba(0,0,0,.35)
        );

}


@keyframes flyHeart {

    0% {

        transform:
            translate(-50%,-50%)
            scale(.1);

        opacity:0;

    }

    20% {

        opacity:1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--r))
            scale(var(--s));

        opacity:1;

    }

}


/* =====================================================
   KALP EZİLME
===================================================== */

.heart.squish {

    animation:
        heartSquish
        .45s
        ease
        forwards;

    pointer-events:none;

}


@keyframes heartSquish {

    0% {

        transform:
            scale(1);

    }

    20% {

        transform:
            scale(1.45,.4)
            rotate(-10deg);

    }

    45% {

        transform:
            scale(.8,1.3)
            rotate(10deg);

    }

    100% {

        transform:
            scale(0);

        opacity:0;

    }

}


/* =====================================================
   KALP ZIPLAMA
===================================================== */

.heart.bounce {

    animation:
        bounceHeart
        .65s
        ease
        forwards;

}


@keyframes bounceHeart {

    0% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(var(--s));

    }

    25% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y) - 50px)
            )
            scale(1.3);

    }

    50% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(.85);

    }

    75% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y) - 22px)
            )
            scale(1.1);

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1);

    }

}


/* =====================================================
   MİNİ KALPLER
===================================================== */

.mini-heart {

    position:absolute;

    left:50%;
    top:50%;

    font-size:17px;

    pointer-events:none;

    z-index:80;

    animation:
        miniHeart
        .8s
        ease-out
        forwards;

}


@keyframes miniHeart {

    0% {

        transform:
            translate(-50%,-50%)
            scale(.2);

        opacity:1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--r))
            scale(.8);

        opacity:0;

    }

}


/* =====================================================
   PARÇACIK
===================================================== */

.particle {

    position:absolute;

    left:50%;
    top:50%;

    width:var(--size);

    height:var(--size);

    border-radius:50%;

    background:var(--color);

    pointer-events:none;

    z-index:60;

    animation:
        particle
        .9s
        ease-out
        forwards;

}


@keyframes particle {

    0% {

        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(0);

        opacity:0;

    }

}


/* =====================================================
   GALAKSİ PARÇALARI
===================================================== */

.galaxy-particle {

    position:absolute;

    left:50%;
    top:50%;

    width:
        35px;

    height:
        35px;

    border-radius:50%;

    pointer-events:none;

    z-index:85;

    animation:
        galaxyParticle
        1.5s
        ease-out
        forwards;

}


@keyframes galaxyParticle {

    0% {

        transform:
            translate(-50%,-50%)
            rotate(0deg)
            scale(.2);

        opacity:0;

    }

    20% {

        opacity:1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(720deg)
            scale(.8);

        opacity:0;

    }

}


/* =====================================================
   GÖKKUŞAĞI PATLAMA
===================================================== */

.rainbow-particle {

    position:absolute;

    left:50%;
    top:50%;

    width:
        12px;

    height:
        12px;

    border-radius:50%;

    pointer-events:none;

    z-index:80;

    animation:
        rainbowParticle
        1s
        ease-out
        forwards;

}


@keyframes rainbowParticle {

    0% {

        transform:
            translate(-50%,-50%)
            scale(.2);

        opacity:1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(0);

        opacity:0;

    }

}


/* =====================================================
   YILDIZ PARÇASI
===================================================== */

.star-particle {

    position:absolute;

    left:50%;
    top:50%;

    color:
        #fff;

    font-size:
        22px;

    pointer-events:none;

    z-index:85;

    animation:
        starParticle
        1.1s
        ease-out
        forwards;

}


@keyframes starParticle {

    0% {

        transform:
            translate(-50%,-50%)
            scale(0)
            rotate(0);

        opacity:0;

    }

    20% {

        opacity:1;

    }

    100% {

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1)
            rotate(360deg);

        opacity:0;

    }

}


/* =====================================================
   HINT
===================================================== */

.hint {

    position:absolute;

    bottom:25px;

    left:50%;

    transform:
        translateX(-50%);

    width:90%;

    text-align:center;

    color:#b9788b;

    font-size:14px;

    z-index:40;

}


.hint b {

    color:#ff9caf;

}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width:600px) {

    .page {

        padding:
            15px 10px;

    }

    .game {

        min-height:
            570px;

        border-radius:
            25px;

    }

    .ball {

        width:
            180px;

        height:
            180px;

        font-size:
            48px;

    }

    .ball-wrap {

        width:
            240px;

        height:
            240px;

    }

    .hint {

        bottom:
            18px;

        font-size:
            13px;

    }

    .heart {

        font-size:
            27px;

    }

    .effect-text {

        font-size:
            34px;

    }

    .theme-btn,
    .galaxy-btn {

        width:
            48px;

        height:
            48px;

        font-size:
            21px;

        top:
            12px;

    }

    .theme-btn {

        right:
            12px;

    }

    .galaxy-btn {

        left:
            12px;

    }

}

</style>

</head>


<body>


<div class="glow one"></div>
<div class="glow two"></div>


<!-- GECE / GÜNDÜZ -->

<button
    class="theme-btn"
    id="themeBtn"
    title="Gece / Gündüz"
>

    🌙

</button>


<!-- GALAKSİ -->

<button
    class="galaxy-btn"
    id="galaxyBtn"
    title="Galaksi modu"
>

    🌌

</button>


<main class="page">


    <h1>
        💕 Sana Özel 💕
    </h1>


    <div class="subtitle">

        Stresini biraz burada bırakabilirsin... 😌

    </div>


    <section

function removeGalaxy() {

        );

/* =====================================================

===================================================== */

ball.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();


        if (pressing)

        pressing = true;

        popped = false;


        ball.classList.add(
            "pressed"
        );


        setTimeout(
            function() {

                if (pressing) {

                    ball.classList.add(
                        "shake"
                    );

                }

            },
            400
        );

    }
);


/* =====================================================
   BIRAKMA
===================================================== */

function releaseBall() {

    if (!pressing)
        return;


    pressing = false;


    ball.classList.remove(
        "pressed"
    );

    ball.classList.remove(
        "shake"
    );


    if (!popped) {

        popped = true;

        explode();

    }

}


ball.addEventListener(
    "pointerup",
    releaseBall
);


ball.addEventListener(
    "pointercancel",
    releaseBall
);


/* =====================================================
   PATLAMA
===================================================== */

function explode() {


    explosionCount++;


    const selected =
        loveEffects[
            Math.floor(
                Math.random() *
                loveEffects.length
            )
        ];


    effectText.textContent =
        selected.text;


    effectText.style.color =
        selected.color;


    effectText.style.textShadow =

        `
        0 0 10px ${selected.color},
        0 0 30px ${selected.color},
        0 0 60px ${selected.color}
        `;


    effectText.classList.remove(
        "show"
    );


    void effectText.offsetWidth;


    effectText.classList.add(
        "show"
    );


    /* Topa özel efekt */

    if (
        currentBall === 0
    ) {

        heartExplosion(
            selected
        );

    }

    else if (
        currentBall === 1
    ) {

        iceExplosion();

    }

    else if (
        currentBall === 2
    ) {

        galaxyExplosion();

    }

    else if (
        currentBall === 3
    ) {

        rainbowExplosion();

    }

    else if (
        currentBall === 4
    ) {

        starExplosion();

    }


    /* Genel kalpler */

    createHearts(
        selected
    );


    screenFlash(
        selected.color
    );


    ball.classList.add(
        "pop"
    );


    setTimeout(
        function() {

            ball.classList.remove(
                "pop"
            );

            changeBall();

        },
        650
    );

}


/* =====================================================
   TOP DEĞİŞTİR
===================================================== */

function changeBall() {


    /*
       Her 2 patlamada
       farklı top
    */

    if (
        explosionCount % 2 !== 0
    ) {

        return;

    }


    currentBall++;


    if (
        currentBall >= balls.length
    ) {

        currentBall = 0;

    }


    const newBall =
        balls[currentBall];


    ball.className =
        "ball " +
        newBall.className;


    ball.textContent =
        newBall.emoji;


    badge.textContent =
        newBall.badge;


    ballName.textContent =
        newBall.name;


    /* Top değişirken efekt */

    ball.animate(

        [

            {

                transform:
                    "scale(0) rotate(-180deg)",

                opacity: 0

            },

            {

                transform:
                    "scale(1.15) rotate(20deg)",

                opacity: 1

            },

            {

                transform:
                    "scale(1) rotate(0)",

                opacity: 1

            }

        ],

        {

            duration:
                600,

            easing:
                "ease-out"

        }

    );

}

/* =====================================================

===================================================== */

function createHearts(
    selected
) {


    const amount =
        12 +
        Math.floor(
            Math.random() * 10
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "heart";


        heart.textContent =
            selected.emojis[
                Math.floor(
                    Math.random() *
                    selected.emojis.length
                )
            ];


        const x =
            Math.random() *
            560 -
            280;


        const y =
            Math.random() *
            450 -
            310;


        heart.style.setProperty(
            "--x",
            x + "px"
        );


        heart.style.setProperty(
            "--y",
            y + "px"
        );


        heart.style.setProperty(
            "--s",
            .6 +
            Math.random() *
            .8
        );


        heart.style.setProperty(
            "--r",
            Math.random() *
            100 -
            50 +
            "deg"
        );


        game.appendChild(
            heart
        );


        heart.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                const random =
                    Math.random();


                if (
                    random < .33
                ) {

                    squashHeart(
                        heart,
                        selected
                    );

                }

                else if (
                    random < .66
                ) {

                    bounceHeart(
                        heart
                    );

                }

                else {

                    splitHeart(
                        heart,
                        selected
                    );

                }

            }
        );


        setTimeout(
            function() {

                if (
                    heart.isConnected
                ) {

                    heart.remove();

                }

            },
            7000
        );

    }

}


/* =====================================================
   KALP EZ
===================================================== */

    heart,
    selected
) {

    heart.classList.add(
        "squish"
    );


    createTinyExplosion(
        heart,
        selected.color
    );


    setTimeout(
        () => heart.remove(),
        450
    );

}


/* =====================================================
   KALP ZIPLA
===================================================== */

    heart
) {

    setTimeout(
        function() {

            heart.classList.remove(
                "bounce"
            );

        },
        700
    );

}


/* =====================================================
   KALP BÖL
===================================================== */

function splitHeart(
    heart,
    selected
) {


    const rect =
        heart.getBoundingClientRect();


    const gameRect =
        game.getBoundingClientRect();


    const left =
        rect.left -
        gameRect.left +
        rect.width / 2;


    const top =
        rect.top -
        gameRect.top +
        rect.height / 2;


    heart.style.opacity =
        "0";


    heart.style.pointerEvents =
        "none";


    for (
        let i = 0;
        i < 6;
        i++
    ) {


        const mini =
            document.createElement(
                "div"
            );


        mini.className =
            "mini-heart";


        mini.textContent =
            selected.emojis[
                Math.floor(
                    Math.random() *
                    selected.emojis.length
                )
            ];


        mini.style.left =
            left + "px";


        mini.style.top =
            top + "px";


        const angle =
            Math.PI *
            2 *
            i /
            6;


        const distance =
            40 +
            Math.random() *
            50;


        mini.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        mini.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        mini.style.setProperty(
            "--r",
            Math.random() *
            100 -
            50 +
            "deg"
        );


        game.appendChild(
            mini
        );


        setTimeout(
            () => mini.remove(),
            850
        );

    }


    createTinyExplosion(
        heart,
        selected.color
    );


    setTimeout(
        () => heart.remove(),
        300
    );

}


/* =====================================================
   KÜÇÜK PATLAMA
===================================================== */

function createTinyExplosion(
    heart,
    color
) {


    const rect =
        heart.getBoundingClientRect();


    const gameRect =
        game.getBoundingClientRect();


    const x =
        rect.left -
        gameRect.left +
        rect.width / 2;


    const y =
        rect.top -
        gameRect.top +
        rect.height / 2;


    for (
        let i = 0;
        i < 8;
        i++
    ) {


        const dot =
            document.createElement(
                "div"
            );


        dot.style.position =
            "absolute";


        dot.style.left =
            x + "px";


        dot.style.top =
            y + "px";


        dot.style.width =
            "6px";


        dot.style.height =
            "6px";


        dot.style.borderRadius =
            "50%";


        dot.style.background =
            color;


        dot.style.pointerEvents =
            "none";


        dot.style.zIndex =
            "100";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            15 +
            Math.random() *
            45;


        dot.animate(

            [

                {

                    transform:
                        "translate(0,0) scale(1)",

                    opacity:1

                },

                {

                    transform:
                        `
                        translate(
                            ${
                                Math.cos(angle) *
                                distance
                            }px,
                            ${
                                Math.sin(angle) *
                                distance
                            }px
                        )
                        scale(0)
                        `,

                    opacity:0

                }

            ],

            {

                duration:450,

                easing:
                    "ease-out"

            }

        );


        game.appendChild(
            dot
        );


        setTimeout(
            () => dot.remove(),
            500
        );

    }

}


/* =====================================================
   EKRAN PARLAMASI
===================================================== */

function screenFlash(
    color
) {


    const flash =
        document.createElement(
            "div"
        );


    flash.style.position =
        "fixed";


    flash.style.inset =
        "0";


    flash.style.background =
        color;


    flash.style.opacity =
        "0";


    flash.style.pointerEvents =
        "none";


    flash.style.zIndex =
        "150";


    document.body.appendChild(
        flash
    );


    flash.animate(

        [

            {
                opacity:0
            },

            {
                opacity:.12
            },

            {
                opacity:0
            }

        ],

        {

            duration:450,

            easing:
                "ease-out"

        }

    );


    setTimeout(
        () => flash.remove(),
        500
    );

}


/* =====================================================
   ARKA PLAN KALPLERİ
===================================================== */

function createBackgroundHeart() {


    if (galaxyMode)
        return;


    const heart =
        document.createElement(
            "div"
        );


    heart.style.position =
        "fixed";


    heart.style.bottom =
        "-50px";


    heart.style.left =
        Math.random() *
        100 +
        "vw";


    heart.style.fontSize =
        15 +
        Math.random() *
        35 +
        "px";


    heart.style.color =
        "rgba(255,100,140,.13)";


    heart.style.pointerEvents =
        "none";


    heart.style.zIndex =
        "1";


    heart.textContent =
        Math.random() < .5
            ? "♡"
            : "♥";


    heart.animate(

        [

            {

                transform:
                    "translateY(0) rotate(0)",

                opacity:0

            },

            {

                opacity:1

            },

            {

                transform:
                    "translateY(-115vh) rotate(360deg)",

                opacity:0

            }

        ],

        {

            duration:
                8000 +
                Math.random() *
                7000,

            easing:
                "linear"

        }

    );


    document.body.appendChild(
        heart
    );


    setTimeout(
        () => heart.remove(),
        16000
    );

}


setInterval(
    createBackgroundHeart,
    800
);


/* İlk kalpler */

for (
    let i = 0;
    i < 6;
    i++
) {

    setTimeout(
        createBackgroundHeart,
        i * 500
    );

}


/* =====================================================
   GALAKSİ MODU AÇILIRSA BAŞLANGIÇTA DAHA ÇOK YILDIZ
===================================================== */

if (
    galaxyMode
) {

    createGalaxy();

}
