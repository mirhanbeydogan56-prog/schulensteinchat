<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>💕 Sana Özel</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            color: white;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 20%,
                    #650b2c 0%,
                    #3b0018 35%,
                    #150008 75%,
                    #080003 100%
                );

        }


        /* ===============================
           ARKA PLAN IŞIKLARI
        =============================== */

        .glow {

            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter: blur(90px);

            opacity: .18;

            pointer-events: none;

            animation:
                glowMove
                8s
                ease-in-out
                infinite
                alternate;

        }

        .glow.one {

            background: #ff174f;

            top: -100px;
            left: -100px;

        }

        .glow.two {

            background: #5c4dff;

            right: -100px;
            bottom: -100px;

            animation-delay: 2s;

        }

        @keyframes glowMove {

            0% {
                transform:
                    translate(0, 0);
            }

            100% {
                transform:
                    translate(100px, -60px);
            }

        }


        /* ===============================
           ARKA PLAN KALPLERİ
        =============================== */

        .bg-heart {

            position: fixed;

            bottom: -50px;

            pointer-events: none;

            color:
                rgba(
                    255,
                    100,
                    140,
                    .13
                );

            animation:
                bgHeart
                linear
                forwards;

            z-index: 1;

        }

        @keyframes bgHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(.6);

                opacity: 0;

            }

            15% {
                opacity: 1;
            }

            100% {

                transform:
                    translateY(-115vh)
                    rotate(360deg)
                    scale(1.3);

                opacity: 0;

            }

        }


        /* ===============================
           ANA SAYFA
        =============================== */

        .page {

            position: relative;

            z-index: 5;

            width: 100%;

            height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding:
                25px 15px;

        }

        h1 {

            margin:
                5px 0 4px;

            color:
                #ff9caf;

            font-size:
                clamp(
                    30px,
                    7vw,
                    48px
                );

            text-align: center;

            text-shadow:
                0 0 25px
                rgba(
                    255,
                    77,
                    109,
                    .5
                );

            animation:
                titlePulse
                3s
                ease-in-out
                infinite;

        }

        @keyframes titlePulse {

            0%,
            100% {

                text-shadow:
                    0 0 15px
                    rgba(
                        255,
                        77,
                        109,
                        .35
                    );

            }

            50% {

                text-shadow:
                    0 0 35px
                    rgba(
                        255,
                        77,
                        109,
                        .8
                    );

            }

        }

        .subtitle {

            color:
                #d493a5;

            text-align: center;

            margin-bottom:
                12px;

            font-size:
                14px;

        }


        /* ===============================
           OYUN ALANI
        =============================== */

        .game {

            position: relative;

            width:
                min(
                    900px,
                    100%
                );

            flex: 1;

            max-height:
                700px;

            border-radius:
                30px;

            border:
                1px solid
                rgba(
                    255,
                    100,
                    130,
                    .18
                );

            background:
                rgba(
                    20,
                    0,
                    10,
                    .45
                );

            box-shadow:
                0 20px 70px
                rgba(
                    0,
                    0,
                    0,
                    .45
                );

            overflow:
                hidden;

        }


        /* ===============================
           ÜST ETİKET
        =============================== */

        .badge {

            position: absolute;

            top: 18px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                8px 16px;

            border-radius:
                50px;

            background:
                rgba(
                    255,
                    77,
                    109,
                    .12
                );

            border:
                1px solid
                rgba(
                    255,
                    143,
                    163,
                    .18
                );

            color:
                #ff9caf;

            font-size:
                13px;

            z-index: 30;

        }


        /* ===============================
           TOP
        =============================== */

        .ball-wrap {

            position: absolute;

            left: 50%;
            top: 50%;

            width:
                270px;

            height:
                270px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            z-index: 10;

        }


        .ball {

            position: relative;

            width:
                205px;

            height:
                205px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 30% 22%,
                    #ffc0cc 0%,
                    #ff708d 20%,
                    #ff3d67 48%,
                    #d3194d 75%,
                    #79001f 100%
                );

            box-shadow:

                inset
                20px
                15px
                30px
                rgba(
                    255,
                    255,
                    255,
                    .2
                ),

                inset
                -25px
                -30px
                40px
                rgba(
                    70,
                    0,
                    20,
                    .5
                ),

                0
                25px
                50px
                rgba(
                    0,
                    0,
                    0,
                    .5
                );

            cursor:
                pointer;

            touch-action:
                none;

            user-select:
                none;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                58px;

            transition:
                transform
                .15s
                ease;

        }


        /* TOP PARLAMASI */

        .ball::before {

            content: "";

            position: absolute;

            width:
                50px;

            height:
                25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .3
                );

            border-radius:
                50%;

            top:
                25px;

            left:
                38px;

            transform:
                rotate(-25deg);

            filter:
                blur(5px);

        }


        /* ===============================
           TOP EZİLME
        =============================== */

        .ball.pressed {

            transform:
                scale(
                    1.15,
                    .72
                );

            border-radius:
                55% 45%
                62% 38% /
                43% 58%
                42% 57%;

            box-shadow:

                inset
                20px
                15px
                35px
                rgba(
                    255,
                    255,
                    255,
                    .18
                ),

                0
                10px
                25px
                rgba(
                    0,
                    0,
                    0,
                    .5
                );

        }


        /* ===============================
           TOP TİTREME
        =============================== */

        .ball.shake {

            animation:
                shake
                .35s
                linear
                infinite;

        }

        @keyframes shake {

            0% {
                margin-left: -3px;
            }

            25% {
                margin-left: 3px;
            }

            50% {
                margin-left: -4px;
            }

            75% {
                margin-left: 4px;
            }

            100% {
                margin-left: 0;
            }

        }


        /* ===============================
           TOP PATLAMA
        =============================== */

        .ball.pop {

            animation:
                pop
                .55s
                ease
                forwards;

        }

        @keyframes pop {

            0% {

                transform:
                    scale(
                        1,
                        .75
                    );

            }

            30% {

                transform:
                    scale(
                        1.35,
                        .55
                    );

            }

            55% {

                transform:
                    scale(.8);

                opacity:
                    .8;

            }

            100% {

                transform:
                    scale(0);

                opacity:
                    0;

            }

        }


        /* ===============================
           AŞKIM YAZISI
        =============================== */

        .effect-text {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(0)
                rotate(-10deg);

            font-size:
                clamp(
                    35px,
                    8vw,
                    70px
                );

            font-weight:
                900;

            color:
                #65dcff;

            text-align:
                center;

            white-space:
                nowrap;

            text-shadow:

                0 0 10px
                #1ebeff,

                0 0 30px
                #168fff,

                0 0 60px
                rgba(
                    30,
                    180,
                    255,
                    .7
                );

            pointer-events:
                none;

            z-index:
                50;

        }

        .effect-text.show {

            animation:
                effectText
                .9s
                ease
                forwards;

        }

        @keyframes effectText {

            0% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0)
                    rotate(-15deg);

                opacity: 0;

            }

            25% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1.25)
                    rotate(8deg);

                opacity: 1;

            }

            70% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1)
                    rotate(0);

                opacity: 1;

            }

            100% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1.5);

                opacity: 0;

            }

        }


        /* ===============================
           MAVİ KALPLER
        =============================== */

        .heart {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            font-size:
                30px;

            cursor:
                pointer;

            z-index:
                25;

            user-select:
                none;

            animation:
                flyHeart
                1.4s
                cubic-bezier(
                    .1,
                    .75,
                    .2,
                    1
                )
                forwards;

            filter:
                drop-shadow(
                    0 5px 7px
                    rgba(
                        0,
                        0,
                        0,
                        .35
                    )
                );

        }


        @keyframes flyHeart {

            0% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(.1);

                opacity:
                    0;

            }

            20% {
                opacity: 1;
            }

            100% {

                transform:
                    translate(
                        calc(
                            -50% +
                            var(--x)
                        ),
                        calc(
                            -50% +
                            var(--y)
                        )
                    )
                    rotate(
                        var(--r)
                    )
                    scale(
                        var(--s)
                    );

                opacity:
                    1;

            }

        }


        /* ===============================
           KALBE DOKUNMA
        =============================== */

        .heart.squish {

            animation:
                squish
                .4s
                ease
                forwards;

            pointer-events:
                none;

        }

        @keyframes squish {

            0% {

                transform:
                    scale(1);

            }

            30% {

                transform:
                    scale(
                        1.5,
                        .35
                    );

            }

            100% {

                transform:
                    scale(0);

                opacity: 0;

            }

        }


        /* ===============================
           PARÇACIKLAR
        =============================== */

        .particle {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                var(--size);

            height:
                var(--size);

            border-radius:
                50%;

            background:
                var(--color);

            pointer-events:
                none;

            z-index:
                20;

            animation:
                particle
                .9s
                ease-out
                forwards;

        }

        @keyframes particle {

            0% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1);

                opacity: 1;

            }

            100% {

                transform:
                    translate(
                        calc(
                            -50% +
                            var(--x)
                        ),
                        calc(
                            -50% +
                            var(--y)
                        )
                    )
                    scale(0);

                opacity: 0;

            }

        }


        /* ===============================
           BALONCUKLAR
        =============================== */

        .bubble {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                var(--size);

            height:
                var(--size);

            border:
                2px solid
                rgba(
                    100,
                    220,
                    255,
                    .65
                );

            border-radius:
                50%;

            pointer-events:
                none;

            z-index:
                18;

            animation:
                bubble
                1.5s
                ease-out
                forwards;

        }

        @keyframes bubble {

            0% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(.2);

                opacity: 0;

            }

            20% {
                opacity: 1;
            }

            100% {

                transform:
                    translate(
                        calc(
                            -50% +
                            var(--x)
                        ),
                        calc(
                            -50% +
                            var(--y)
                        )
                    )
                    scale(1.3);

                opacity: 0;

            }

        }


        /* ===============================
           KÜÇÜK YAZI
        =============================== */

        .hint {

            position:
                absolute;

            bottom:
                25px;

            left:
                50%;

            transform:
                translateX(-50%);

            width:
                90%;

            text-align:
                center;

            color:
                #b9788b;

            font-size:
                14px;

            z-index:
                40;

        }

        .hint b {

            color:
                #ff9caf;

        }


        /* ===============================
           MOBİL
        =============================== */

        @media (
            max-width: 600px
        ) {

            .page {

                padding:
                    15px 10px;

            }

            .game {

                min-height:
                    570px;

                border-radius:
                    25px;

            }

            .ball {

                width:
                    180px;

                height:
                    180px;

                font-size:
                    48px;

            }

            .ball-wrap {

                width:
                    240px;

                height:
                    240px;

            }

            .hint {

                bottom:
                    18px;

                font-size:
                    13px;

            }

            .heart {

                font-size:
                    27px;

            }

            .effect-text {

                font-size:
                    34px;

            }

        }

    </style>

</head>


<body>


    <div class="glow one"></div>

    <div class="glow two"></div>


    <main class="page">


        <h1>
            💕 Sana Özel 💕
        </h1>


        <div class="subtitle">

            Stresini biraz burada bırakabilirsin... 😌

        </div>


        <section
            class="game"
            id="game"
        >


            <div class="badge">

                💙 Biraz sık bakalım...

            </div>


            <!-- STRES TOPU -->

            <div class="ball-wrap">

                <div
                    class="ball"
                    id="ball"
                >

                    💗

                </div>

            </div>


            <!-- RASTGELE AŞK SÖZÜ -->

            <div
                class="effect-text"
                id="effectText"
            >

                AŞKIMMM 💕

            </div>


            <div class="hint">

                <b>Basılı tut</b>
                → topu ez

                <br>

                Bırak
                → içinden çıkan kalplere dokun 💙

            </div>


        </section>


    </main>


    <script>


        const game =
            document.getElementById(
                "game"
            );


        const ball =
            document.getElementById(
                "ball"
            );


        const effectText =
            document.getElementById(
                "effectText"
            );


        let pressing =
            false;

        let popped =
            false;


        /* =================================
           RASTGELE SÖZLER
        ================================= */

        const loveEffects = [

            {
                text:
                    "AŞKIMMM 💕",

                color:
                    "#ff6f91",

                emojis: [
                    "💕",
                    "💗",
                    "💖"
                ]
            },

            {
                text:
                    "BALIMMM 🩷",

                color:
                    "#ff8fc4",

                emojis: [
                    "🩷",
                    "💗",
                    "🌸"
                ]
            },

            {
                text:
                    "GÜZELİMMM 💗",

                color:
                    "#ff729e",

                emojis: [
                    "💗",
                    "🌷",
                    "✨"
                ]
            },

            {
                text:
                    "PRENSESİMMM 👑",

                color:
                    "#ffd166",

                emojis: [
                    "👑",
                    "💛",
                    "✨"
                ]
            },

            {
                text:
                    "YAVRUMMM 🥹",

                color:
                    "#a98cff",

                emojis: [
                    "🥹",
                    "💜",
                    "💙"
                ]
            },

            {
                text:
                    "ÖMRÜMMM 💙",

                color:
                    "#51d9ff",

                emojis: [
                    "💙",
                    "🩵",
                    "✨"
                ]
            }

        ];


        /* =================================
           TOPA BASMA
        ================================= */

        ball.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();


                if (pressing)
                    return;


                pressing =
                    true;


                popped =
                    false;


                ball.classList.add(
                    "pressed"
                );


                setTimeout(
                    function() {

                        if (
                            pressing
                        ) {

                            ball.classList.add(
                                "shake"
                            );

                        }

                    },
                    400
                );

            }
        );


        /* =================================
           TOPU BIRAKMA
        ================================= */

        function releaseBall() {

            if (!pressing)
                return;


            pressing =
                false;


            ball.classList.remove(
                "pressed"
            );


            ball.classList.remove(
                "shake"
            );


            if (!popped) {

                popped =
                    true;

                explode();

            }

        }


        ball.addEventListener(
            "pointerup",
            releaseBall
        );


        ball.addEventListener(
            "pointercancel",
            releaseBall
        );


        /* =================================
           PATLAMA
        ================================= */

        function explode() {


            const selected =
                loveEffects[
                    Math.floor(
                        Math.random() *
                        loveEffects.length
                    )
                ];


            /* Yazıyı değiştir */

            effectText.textContent =
                selected.text;


            /* Rengini değiştir */

            effectText.style.color =
                selected.color;


            effectText.style.textShadow =

                `
                0 0 10px ${selected.color},
                0 0 30px ${selected.color},
                0 0 60px ${selected.color}
                `;


            /* Animasyonu sıfırla */

            effectText.classList.remove(
                "show"
            );


            void effectText.offsetWidth;


            effectText.classList.add(
                "show"
            );


            /* Topu patlat */

            ball.classList.add(
                "pop"
            );


            /* Kalpler */

            createHearts(
                selected
            );


            /* Parçacıklar */

            createParticles(
                selected
            );


            /* Baloncuklar */

            createBubbles();


            /* Küçük ekran efekti */

            screenFlash(
                selected.color
            );


            /* Top geri gelsin */

            setTimeout(
                function() {

                    ball.classList.remove(
                        "pop"
                    );

                    ball.style.animation =
                        "none";

                    void ball.offsetWidth;

                    ball.style.animation =
                        "";

                },
                650
            );

        }


        /* =================================
           KALPLER
        ================================= */

        function createHearts(
            selected
        ) {


            const amount =
                12 +
                Math.floor(
                    Math.random() *
                    12
                );


            for (
                let i = 0;
                i < amount;
                i++
            ) {


                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "heart";


                heart.textContent =
                    selected.emojis[
                        Math.floor(
                            Math.random() *
                            selected.emojis.length
                        )
                    ];


                const x =
                    Math.random() *
                    560 -
                    280;


                const y =
                    Math.random() *
                    450 -
                    310;


                const scale =
                    .6 +
                    Math.random() *
                    1;


                const rotate =
                    Math.random() *
                    100 -
                    50;


                heart.style.setProperty(
                    "--x",
                    x + "px"
                );


                heart.style.setProperty(
                    "--y",
                    y + "px"
                );


                heart.style.setProperty(
                    "--s",
                    scale
                );


                heart.style.setProperty(
                    "--r",
                    rotate + "deg"
                );


                game.appendChild(
                    heart
                );


                /* Kalbe dokununca ez */

                heart.addEventListener(
                    "pointerdown",
                    function(event) {

                        event.stopPropagation();


                        heart.classList.add(
                            "squish"
                        );


                        createTinyExplosion(
                            heart,
                            selected.color
                        );


                        setTimeout(
                            function() {

                                heart.remove();

                            },
                            400
                        );

                    }
                );


                /* Bir süre sonra kaybol */

                setTimeout(
                    function() {

                        if (
                            heart.isConnected
                        ) {

                            heart.classList.add(
                                "squish"
                            );


                            setTimeout(
                                function() {

                                    heart.remove();

                                },
                                400
                            );

                        }

                    },
                    6000
                );

            }

        }


        /* =================================
           KALP KÜÇÜK PATLAMA
        ================================= */

        function createTinyExplosion(
            heart,
            color
        ) {


            for (
                let i = 0;
                i < 6;
                i++
            ) {


                const dot =
                    document.createElement(
                        "div"
                    );


                dot.style.position =
                    "absolute";


                dot.style.width =
                    "6px";


                dot.style.height =
                    "6px";


                dot.style.borderRadius =
                    "50%";


                dot.style.background =
                    color;


                dot.style.left =
                    heart.offsetLeft +
                    "px";


                dot.style.top =
                    heart.offsetTop +
                    "px";


                dot.style.pointerEvents =
                    "none";


                dot.style.zIndex =
                    "60";


                game.appendChild(
                    dot
                );


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    15 +
                    Math.random() *
                    40;


                dot.animate(

                    [

                        {

                            transform:
                                "translate(0,0) scale(1)",

                            opacity:
                                1

                        },

                        {

                            transform:
                                `
                                translate(
                                    ${
                                        Math.cos(angle)
                                        * distance
                                    }px,
                                    ${
                                        Math.sin(angle)
                                        * distance
                                    }px
                                )
                                scale(0)
                                `,

                            opacity:
                                0

                        }

                    ],

                    {

                        duration:
                            450,

                        easing:
                            "ease-out"

                    }

                );


                setTimeout(
                    function() {

                        dot.remove();

                    },
                    500
                );

            }

        }


        /* =================================
           PARÇACIKLAR
        ================================= */

        function createParticles(
            selected
        ) {


            for (
                let i = 0;
                i < 35;
                i++
            ) {


                const p =
                    document.createElement(
                        "div"
                    );


                p.className =
                    "particle";


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    100 +
                    Math.random() *
                    260;


                p.style.setProperty(
                    "--x",
                    (
                        Math.cos(angle) *
                        distance
                    ) + "px"
                );


                p.style.setProperty(
                    "--y",
                    (
                        Math.sin(angle) *
                        distance
                    ) + "px"
                );


                p.style.setProperty(
                    "--size",
                    (
                        4 +
                        Math.random() *
                        8
                    ) + "px"
                );


                p.style.setProperty(
                    "--color",
                    selected.color
                );


                game.appendChild(
                    p
                );


                setTimeout(
                    function() {

                        p.remove();

                    },
                    1000
                );

            }

        }


        /* =================================
           BALONCUKLAR
        ================================= */

        function createBubbles() {


            for (
                let i = 0;
                i < 12;
                i++
            ) {


                const bubble =
                    document.createElement(
                        "div"
                    );


                bubble.className =
                    "bubble";


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    100 +
                    Math.random() *
                    250;


                bubble.style.setProperty(
                    "--x",
                    (
                        Math.cos(angle) *
                        distance
                    ) + "px"
                );


                bubble.style.setProperty(
                    "--y",
                    (
                        Math.sin(angle) *
                        distance
                    ) + "px"
                );


                bubble.style.setProperty(
                    "--size",
                    (
                        12 +
                        Math.random() *
                        30
                    ) + "px"
                );


                game.appendChild(
                    bubble
                );


                setTimeout(
                    function() {

                        bubble.remove();

                    },
                    1600
                );

            }

        }


        /* =================================
           EKRAN PARLAMASI
        ================================= */

        function screenFlash(
            color
        ) {


            const flash =
                document.createElement(
                    "div"
                );


            flash.style.position =
                "fixed";


            flash.style.inset =
                "0";


            flash.style.background =
                color;


            flash.style.opacity =
                "0";


            flash.style.pointerEvents =
                "none";


            flash.style.zIndex =
                "100";


            document.body.appendChild(
                flash
            );


            flash.animate(

                [

                    {
                        opacity: 0
                    },

                    {
                        opacity: .12
                    },

                    {
                        opacity: 0
                    }

                ],

                {

                    duration:
                        450,

                    easing:
                        "ease-out"

                }

            );


            setTimeout(
                function() {

                    flash.remove();

                },
                500
            );

        }


        /* =================================
           ARKA PLAN KALPLERİ
        ================================= */

        function createBackgroundHeart() {


            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "bg-heart";


            heart.textContent =
                Math.random() < .5
                    ? "♡"
                    : "♥";


            heart.style.left =
                Math.random() *
                100 +
                "vw";


            heart.style.fontSize =
                (
                    15 +
                    Math.random() *
                    35
                ) +
                "px";


            heart.style.animationDuration =
                (
                    7 +
                    Math.random() *
                    8
                ) +
                "s";


            document.body.appendChild(
                heart
            );


            setTimeout(
                function() {

                    heart.remove();

                },
                16000
            );

        }


        setInterval(
            createBackgroundHeart,
            800
        );


        /* İlk kalpler */

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            setTimeout(
                createBackgroundHeart,
                i * 500
            );

        }

    </script>

</body>
