<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>💕 D mi C mi?</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #140008,
                    #3b0015,
                    #17000a
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        /* =========================
           ANA CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 950px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

        }


        /* =========================
           KART
        ========================= */

        .card {

            background:
                rgba(30, 0, 12, 0.94);

            border:
                1px solid
                rgba(255, 77, 109, 0.3);

            border-radius: 25px;

            padding: 25px;

            box-shadow:
                0 20px 60px #0008;

        }


        .card h2 {

            text-align: center;

            color: #ff8fa3;

            margin-top: 0;

        }


        /* =========================
           CHAT
        ========================= */

        #messages {

            width: 100%;

            height: 420px;

            overflow-y: auto;

            padding: 15px;

            border-radius: 15px;

            background:
                rgba(0, 0, 0, 0.35);

            border:
                1px solid
                rgba(255,255,255,0.08);

            margin-bottom: 15px;

        }


        .message {

            padding: 10px 14px;

            margin-bottom: 10px;

            background: #3a0c1d;

            border-radius: 12px;

            word-break: break-word;

        }


        .message b {

            color: #ff8fa3;

        }


        .chat-input {

            display: flex;

            gap: 8px;

        }


        #msg {

            flex: 1;

            min-width: 0;

            padding: 14px;

            border-radius: 12px;

            border:
                1px solid #5c1730;

            background: #18000a;

            color: white;

            outline: none;

            font-size: 15px;

        }


        .send-btn {

            width: 90px;

            padding: 14px 5px;

            border: none;

            border-radius: 12px;

            background: #ff4d6d;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .send-btn:hover {

            background: #ff3158;

        }


        /* =========================
           ÇARK KARTI
        ========================= */

        .wheel-card {

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        .player-name {

            text-align: center;

            color: #c98998;

            font-size: 14px;

            margin-bottom: 5px;

        }


        .player-name span {

            color: #ff8fa3;

            font-weight: bold;

        }


        /* =========================
           ÇARK
        ========================= */

        .wheel-wrapper {

            position: relative;

            width: 330px;

            height: 330px;

            margin:
                25px auto;

        }


        #wheel {

            width: 100%;

            height: 100%;

            border-radius: 50%;

            border:
                8px solid #ff8fa3;

            background:

                conic-gradient(

                    #ff4d6d 0deg 180deg,

                    #5c1730 180deg 360deg

                );

            box-shadow:

                0 0 0 5px #25000d,

                0 10px 35px #0009;

            position: relative;

            transform:
                rotate(0deg);

            transition:
                transform 4s
                cubic-bezier(
                    0.12,
                    0.65,
                    0.15,
                    1
                );

        }


        /* =========================
           D
        ========================= */

        .letter-d {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%)
                translateY(-75px);

            font-size: 65px;

            font-weight: bold;

            color: white;

            text-shadow:
                0 5px 15px #0009;

            pointer-events: none;

        }


        /* =========================
           C
        ========================= */

        .letter-c {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%)
                translateY(75px);

            font-size: 65px;

            font-weight: bold;

            color: white;

            text-shadow:
                0 5px 15px #0009;

            pointer-events: none;

        }


        /* =========================
           MERKEZ
        ========================= */

        .center {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 70px;

            height: 70px;

            border-radius: 50%;

            background: #ff4d6d;

            border:
                6px solid #25000d;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 25px;

            z-index: 5;

            box-shadow:
                0 5px 20px #0008;

        }


        /* =========================
           OK
        ========================= */

        .pointer {

            position: absolute;

            top: -18px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 0;

            height: 0;

            border-left:
                18px solid transparent;

            border-right:
                18px solid transparent;

            border-top:
                35px solid #ff8fa3;

            z-index: 10;

            filter:
                drop-shadow(
                    0 4px 5px #0008
                );

        }


        /* =========================
           ÇEVİR BUTONU
        ========================= */

        #spinBtn {

            width: 230px;

            padding: 16px;

            border: none;

            border-radius: 14px;

            background: #ff4d6d;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 20px #0006;

            transition:
                0.2s;

        }


        #spinBtn:hover {

            transform:
                scale(1.04);

            background: #ff3158;

        }


        #spinBtn:active {

            transform:
                scale(0.98);

        }


        #spinBtn:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           SONUÇ
        ========================= */

        #result {

            min-height: 45px;

            margin-top: 18px;

            text-align: center;

            font-size: 23px;

            font-weight: bold;

            color: #ff8fa3;

        }


        #status {

            text-align: center;

            color: #9f6675;

            font-size: 13px;

            margin-top: 5px;

        }


        /* =========================
           GERİ BUTONU
        ========================= */

        .back-btn {

            position: fixed;

            top: 20px;

            left: 20px;

            width: 55px;

            height: 55px;

            border-radius: 50%;

            border: none;

            background: #ff4d6d;

            color: white;

            font-size: 25px;

            cursor: pointer;

            z-index: 999;

            box-shadow:
                0 5px 20px #0008;

            transition:
                0.2s;

        }


        .back-btn:hover {

            transform:
                scale(1.08);

            background:
                #ff3158;

        }


        /* =========================
           MOBİL
        ========================= */

        @media (max-width: 750px) {

            body {

                padding:
                    80px 12px 20px;

                align-items:
                    flex-start;

            }


            .container {

                grid-template-columns:
                    1fr;

            }


            .wheel-wrapper {

                width: 280px;

                height: 280px;

            }


            #messages {

                height: 300px;

            }


            .letter-d,
            .letter-c {

                font-size: 55px;

            }


            .letter-d {

                transform:
                    translate(-50%, -50%)
                    translateY(-65px);

            }


            .letter-c {

                transform:
                    translate(-50%, -50%)
                    translateY(65px);

            }

        }


        @media (max-width: 400px) {

            .wheel-wrapper {

                width: 250px;

                height: 250px;

            }


            .center {

                width: 60px;

                height: 60px;

            }


            .letter-d,
            .letter-c {

                font-size: 48px;

            }

        }

    </style>


    <!-- =========================
         FIREBASE
    ========================= -->

    <script type="module">

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";


        import {
            getDatabase,
            ref,
            push,
            onChildAdded
        }
        from
        "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


        /* =========================
           FIREBASE AYARLARI
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyDGibvGAFm4CSFMvskXmH1weYn1EyDV3yI",

            authDomain:
                "teett-b2ca0.firebaseapp.com",

            databaseURL:
                "https://teett-b2ca0-default-rtdb.europe-west1.firebasedatabase.app",

            projectId:
                "teett-b2ca0",

            storageBucket:
                "teett-b2ca0.firebasestorage.app",

            messagingSenderId:
                "409690180731",

            appId:
                "1:409690180731:web:f9613a3b7626d318cce6de"

        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getDatabase(app);


        /* =========================
           KULLANICI
        ========================= */

        let user =
            localStorage.getItem(
                "dcUser"
            );


        if (!user) {

            const name =
                prompt(
                    "Oyuna girmeden önce adını yaz:"
                );


            if (
                name &&
                name.trim()
            ) {

                user =
                    name.trim();

                localStorage.setItem(
                    "dcUser",
                    user
                );

            }

            else {

                user = "Misafir";

            }

        }


        document
            .getElementById(
                "userName"
            )
            .textContent = user;


        /* =========================
           CHAT
        ========================= */

        const messagesRef =
            ref(
                db,
                "dcChat"
            );


        window.sendMessage =
            function () {

                const input =
                    document.getElementById(
                        "msg"
                    );


                const text =
                    input.value.trim();


                if (!text)
                    return;


                push(
                    messagesRef,
                    {

                        user: user,

                        text: text,

                        time: Date.now()

                    }
                );


                input.value = "";

                input.focus();

            };


        /* ENTER İLE MESAJ */

        document
            .getElementById("msg")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        sendMessage();

                    }

                }
            );


        /* CHAT MESAJLARINI DİNLE */

        onChildAdded(
            messagesRef,
            function(snapshot) {

                const data =
                    snapshot.val();


                const message =
                    document.createElement(
                        "div"
                    );


                message.className =
                    "message";


                const name =
                    document.createElement(
                        "b"
                    );


                name.textContent =
                    data.user + ": ";


                const text =
                    document.createElement(
                        "span"
                    );


                text.textContent =
                    data.text;


                message.appendChild(
                    name
                );


                message.appendChild(
                    text
                );


                const box =
                    document.getElementById(
                        "messages"
                    );


                box.appendChild(
                    message
                );


                box.scrollTop =
                    box.scrollHeight;

            }
        );


        /* =========================
           ÇARK
           
           BURADA FIREBASE YOK!
           
           HER OYUNCUNUN ÇARKI
           TAMAMEN KENDİSİNE AİT.
        ========================= */

        const wheel =
            document.getElementById(
                "wheel"
            );


        const spinButton =
            document.getElementById(
                "spinBtn"
            );


        const result =
            document.getElementById(
                "result"
            );


        const status =
            document.getElementById(
                "status"
            );


        let spinning = false;


        let rotation = 0;


        /* =========================
           ÇARKI ÇEVİR
        ========================= */

        window.spin =
            function() {

                /*
                 * Çark zaten dönüyorsa
                 * tekrar basılamaz.
                 */

                if (spinning)
                    return;


                spinning = true;


                spinButton.disabled =
                    true;


                result.textContent =
                    "🎡 Dönüyor...";


                status.textContent =
                    "Şansını bekle 😏";


                /*
                 * RANDOM:
                 *
                 * %50 D
                 * %50 C
                 */

                const random =
                    Math.random();


                let finalResult;


                if (
                    random < 0.5
                ) {

                    finalResult = "D";

                }

                else {

                    finalResult = "C";

                }


                /*
                 * D üst tarafta,
                 * C alt tarafta.
                 *
                 * 5-8 tam tur ekliyoruz.
                 */

                const turns =
                    5 +
                    Math.floor(
                        Math.random() * 4
                    );


                /*
                 * Çarkın mevcut açısı
                 */

                const current =
                    rotation % 360;


                let target;


                if (
                    finalResult === "D"
                ) {

                    /*
                     * D için üst
                     */

                    target =
                        360 -
                        current;

                }

                else {

                    /*
                     * C için alt
                     */

                    target =
                        180 -
                        current;

                }


                /*
                 * Negatif olmasını engelle
                 */

                target =
                    (
                        target + 360
                    ) % 360;


                rotation +=
                    (
                        turns * 360
                    ) + target;


                /*
                 * Animasyon
                 */

                wheel.style.transform =
                    `rotate(${rotation}deg)`;


                /*
                 * 4 saniye sonra sonuç
                 */

                setTimeout(
                    function() {

                        spinning =
                            false;


                        spinButton.disabled =
                            false;


                        if (
                            finalResult === "D"
                        ) {

                            result.innerHTML =
                                "💗 Sonuç: <strong>D</strong>";

                        }

                        else {

                            result.innerHTML =
                                "❤️ Sonuç: <strong>C</strong>";

                        }


                        status.textContent =
                            "Tekrar çevirebilirsin 😏";


                    },
                    4000
                );

            };


        /* =========================
           GERİ DÖN
        ========================= */

        window.goBack =
            function() {

                window.location.href =
                    "index.html";

            };

    </script>

</head>


<body>


    <!-- =========================
         GERİ BUTONU
    ========================= -->

    <button
        class="back-btn"
        onclick="goBack()"
        title="Geri dön">

        ←

    </button>


    <div class="container">


        <!-- =====================
             CHAT
        ====================== -->

        <div class="card">

            <h2>
                💕 Canlı Sohbet
            </h2>


            <div id="messages"></div>


            <div class="chat-input">

                <input
                    id="msg"
                    type="text"
                    maxlength="500"
                    placeholder="Mesaj yaz..."
                    autocomplete="off"
                >


                <button
                    class="send-btn"
                    onclick="sendMessage()">

                    Gönder

                </button>

            </div>

        </div>


        <!-- =====================
             ÇARK
        ====================== -->

        <div class="card wheel-card">

            <h2>
                🎡 D mi C mi?
            </h2>


            <div class="player-name">

                Oyuncu:
                <span id="userName"></span>

            </div>


            <div class="wheel-wrapper">


                <!-- OK -->

                <div class="pointer"></div>


                <!-- ÇARK -->

                <div id="wheel">


                    <div class="letter-d">
                        D
                    </div>


                    <div class="letter-c">
                        C
                    </div>


                    <div class="center">
                        💕
                    </div>


                </div>

            </div>


            <button
                id="spinBtn"
                onclick="spin()">

                🎡 ÇARKI ÇEVİR

            </button>


            <div id="result">

                Hazır mısın? 😏

            </div>


            <div id="status">

                Bu çark sadece senin ekranında döner.

            </div>

        </div>


    </div>


</body>

</html>
