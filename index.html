<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OyunuMaDokunma</title>

<style>
body {
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container {
    margin-top:100px;
}

h1 {
    font-size:40px;
}

.counter {
    font-size:50px;
    margin:20px 0;
    color:#a100ff;
}

input {
    padding:10px;
    margin:5px;
    font-size:16px;
}

button {
    background:#a100ff;
    color:white;
    padding:15px 30px;
    font-size:18px;
    border:none;
    cursor:pointer;
}

button.clicked {
    background:#00c853;
}

.tick {
    font-size:25px;
    margin-left:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 OYUNUMA DOKUNMA</h1>
<p>Slogana katılmak istiyor musun?</p>

<div class="counter">
Topluluğumuz: <span id="count">0</span> kişi
</div>

<input type="text" id="name" placeholder="İsim" required>
<input type="text" id="surname" placeholder="Soyisim" required>
<br><br>

<button id="joinBtn">
Katılıyorum
<span id="tick"></span>
</button>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "BURAYA_APIKEY",
  authDomain: "BURAYA_AUTHDOMAIN",
  projectId: "BURAYA_PROJECTID",
  storageBucket: "BURAYA_STORAGE",
  messagingSenderId: "BURAYA_ID",
  appId: "BURAYA_APPID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const countElement = document.getElementById("count");
const joinBtn = document.getElementById("joinBtn");
const tick = document.getElementById("tick");

async function updateCount() {
    const querySnapshot = await getDocs(collection(db, "katilanlar"));
    countElement.textContent = querySnapshot.size;
}

updateCount();

joinBtn.addEventListener("click", async () => {

    const name = document.getElementById("name").value;
    const surname = document.getElementById("surname").value;

    if(name === "" || surname === "") {
        alert("İsim ve soyisim zorunlu!");
        return;
    }

    await addDoc(collection(db, "katilanlar"), {
        isim: name,
        soyisim: surname,
        tarih: new Date()
    });

    joinBtn.classList.add("clicked");
    tick.textContent = "✔";

    updateCount();
});

</script>

</body>
</html>
