    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

        import {
            getDatabase,
            ref,
            push,
            onChildAdded
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


        const firebaseConfig = {

            apiKey: "AIzaSyDGibvGAFm4CSFMvskXmH1weYn1EyDV3yI",

            authDomain: "teett-b2ca0.firebaseapp.com",

            databaseURL:
                "https://teett-b2ca0-default-rtdb.europe-west1.firebasedatabase.app",

            projectId: "teett-b2ca0",

            storageBucket:
                "teett-b2ca0.firebasestorage.app",

            messagingSenderId: "409690180731",

            appId:
                "1:409690180731:web:f9613a3b7626d318cce6de"

        };


        const app = initializeApp(firebaseConfig);

        const db = getDatabase(app);


        let user = "";


        /* =========================
           GİRİŞ
        ========================= */

        window.login = function () {

            const pass =
                document.getElementById("pass").value.trim();


            if (pass === "mirhan5685") {

                user = "Mirhan";

                document.body.className = "mirhan";

            }

            else if (pass === "azra5685") {

                user = "Azra";

                document.body.className = "azra";

            }

            else {

                alert("Hatalı şifre!");

                return;

            }


            document.getElementById("login").style.display = "none";

            document.getElementById("chat").style.display = "block";


            /* MÜZİK */

            const music =
                document.getElementById("bgMusic");

            music.volume = 0.5;

            music.play().catch(error => {

                console.log(
                    "Müzik otomatik başlatılamadı:",
                    error
                );

            });

        };


        /* ENTER İLE GİRİŞ */

        document
            .getElementById("pass")
            .addEventListener("keydown", function (event) {

                if (event.key === "Enter") {

                    login();

                }

            });


        /* =========================
           MESAJ GÖNDER
        ========================= */

        window.sendMessage = function () {

            const input =
                document.getElementById("msg");

            const text =
                input.value.trim();


            if (text === "") return;


            push(ref(db, "messages"), {

                user: user,

                text: text,

                time: Date.now()

            });


            input.value = "";

            input.focus();

        };


        /* ENTER İLE MESAJ */

        document
            .getElementById("msg")
            .addEventListener("keydown", function (event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            });


        /* =========================
           MESAJLARI DİNLE
        ========================= */

        onChildAdded(
            ref(db, "messages"),
            (data) => {

                const m = data.val();


                const message =
                    document.createElement("div");

                message.className = "message";


                const name =
                    document.createElement("b");

                name.textContent =
                    m.user + ": ";


                const text =
                    document.createElement("span");

                text.textContent =
                    m.text;


                message.appendChild(name);

                message.appendChild(text);


                const messages =
                    document.getElementById("messages");


                messages.appendChild(message);


                /* En alta kaydır */

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );


        /* =========================
           GÜL ANİMASYONU
        ========================= */

        window.makeFlowers = function () {

            for (let i = 0; i < 35; i++) {

                const flower =
                    document.createElement("div");


                flower.className = "flower";


                flower.innerHTML = "🌹";


                flower.style.left =
                    Math.random() * 100 + "vw";


                flower.style.fontSize =
                    (20 + Math.random() * 25) + "px";


                flower.style.animationDuration =
                    (3 + Math.random() * 4) + "s";


                flower.style.animationDelay =
                    Math.random() * 1.5 + "s";


                document.body.appendChild(flower);


                setTimeout(() => {

                    flower.remove();

                }, 8000);

            }

        };


        /* =========================
           FİLM SAYFASINI AÇ
        ========================= */

        window.openFilm = function () {

            /* Önce gülleri göster */

            makeFlowers();


            /* Kısa animasyondan sonra film1.html */

            setTimeout(() => {

                window.location.href = "film1.html";

            }, 900);

        };

    </script>

        </button>

        </h2>

            id="msg"
            placeholder="Mesaj yaz..."
            autocomplete="off"
            maxlength="500"
        >


        <button onclick="sendMessage()">
            Gönder
        </button>

    </div>

    <audio
        id="bgMusic"
        src="./music.mp3"
        loop
        preload="auto">
    </audio>


</body>

</html>
