<head>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


const firebaseConfig = {

  apiKey: "AIzaSyDGibvGAFm4CSFMvskXmH1weYn1EyDV3yI",

  authDomain: "teett-b2ca0.firebaseapp.com",

  databaseURL: "https://teett-b2ca0-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "teett-b2ca0",

  storageBucket: "teett-b2ca0.firebasestorage.app",

  messagingSenderId: "409690180731",

  appId: "1:409690180731:web:f9613a3b7626d318cce6de"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

let user = "";

const music = new Audio("./music.mp3");

music.loop = true;

music.volume = 0.5;


/* MÜZİĞİ BAŞLAT */

function startMusic(){

    music.play()
    .then(() => {

        document.getElementById("musicBtn").innerHTML = "🔊";

    })
    .catch((error) => {

        console.log("Müzik hatası:", error);

        alert("Müzik açılamadı! music.mp3 dosyasının index.html ile aynı klasörde olduğundan emin ol.");

    });

}


/* MÜZİK BUTONU */

window.toggleMusic = function(){

    if(music.paused){

        startMusic();

    }else{

        music.pause();

        document.getElementById("musicBtn").innerHTML = "🔇";

    }

}


/* GİRİŞ */

window.login = function () {

    const pass = document.getElementById("pass").value;


    if (pass === "mirhan5685") {

        user = "Mirhan";

        document.body.className = "mirhan";


    } else if (pass === "azra5685") {

        user = "azra";

        document.body.className = "merve";


    } else {

        alert("Hatalı şifre!");

        return;

    }


    document.getElementById("login").style.display = "none";

    document.getElementById("chat").style.display = "block";


    /* GİRİŞTEN SONRA MÜZİĞİ BAŞLAT */

    startMusic();

}


/* MESAJ GÖNDER */

window.sendMessage = function () {

    const text = document.getElementById("msg").value;


    if(text == "") return;


    push(ref(db,"messages"),{

        user:user,

        text:text

    });


    document.getElementById("msg").value = "";

}


/* MESAJLARI GETİR */

onChildAdded(ref(db,"messages"),(data)=>{

    const m = data.val();


    document.getElementById("messages").innerHTML += `

    <div class="message">

        <b>${m.user}:</b> ${m.text}

    </div>`;

});

</script>

</head>
