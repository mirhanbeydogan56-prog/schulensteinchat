<body>

<!-- ================= LOGIN ================= -->

<div id="loginScreen">

  <div class="login-box">

<div class="container">

  <div class="top">
    <h1>❤️ Azra & Mirhan ❤️</h1>
    <p>Birlikte Film İzle</p>
  </div>


  <div class="card">

    <!-- ================= VIDEO ================= -->

    <div class="video">
      <div id="player"></div>
    </div>


    <!-- ================= URL ================= -->

    <div class="controls">

      <input
        id="youtubeUrl"
        placeholder="YouTube linkini yapıştır..."
      >

      <button id="loadButton">
        Videoyu Aç
      </button>

    </div>


    <!-- ================= MANUEL KONTROLLER ================= -->

    <div class="small-buttons">

      <button id="playButton">
        ▶ Oynat
      </button>

      <button id="pauseButton">
        ⏸ Durdur
      </button>

      <button id="syncButton">
        🔄 Senkronla
      </button>

    </div>


    <div class="status">
      Durum:
      <span id="statusText">Bağlanıyor...</span>
    </div>


    <!-- ================= CHAT ================= -->

    <div class="chat">

      <div class="chat-header">

        <h2>💬 Chat</h2>

        <span id="userText"></span>

      </div>

      <div class="chat-input">

        <input
          id="messageInput"
          placeholder="Mesaj yaz..."
          maxlength="500"
          autocomplete="off"
        >

        <button id="sendButton">
          Gönder
        </button>

      </div>

    </div>

  </div>

</div>


<!-- YOUTUBE API -->

<script src="https://www.youtube.com/iframe_api"></script>


<!-- ================= FIREBASE ================= -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

  import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    onChildAdded
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


  /* FIREBASE */

  const firebaseConfig = {

    apiKey: "AIzaSyDGibvGAFm4CSFMvskXmH1weYn1EyDV3yI",

    authDomain:
      "teett-b2ca0.firebaseapp.com",

    databaseURL:
      "https://teett-b2ca0-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
      "teett-b2ca0",

    storageBucket:
      "teett-b2ca0.firebasestorage.app",

    messagingSenderId:
      "409690180731",

    appId:
      "1:409690180731:web:f9613a3b7626d318cce6de"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getDatabase(app);


  /* ================= LOGIN ================= */

  const users = {

    "azra5685": "Azra",

    "mirhan5685": "Mirhan"

  };


  let currentUser = null;


  const savedUser =
    localStorage.getItem("film_user");


  if (
    savedUser === "Azra" ||
    savedUser === "Mirhan"
  ) {

    currentUser = savedUser;

    document
      .getElementById("loginScreen")
      .style.display = "none";

    document
      .getElementById("userText")
      .textContent =
      "👤 " + currentUser;

  }


  function login() {

    const code =
      document
        .getElementById("loginCode")
        .value
        .trim()
        .toLowerCase();


    if (!users[code]) {

      document
        .getElementById("loginError")
        .textContent =
        "Hatalı giriş kodu.";

      return;

    }


    currentUser =
      users[code];


    localStorage.setItem(
      "film_user",
      currentUser
    );


    document
      .getElementById("loginScreen")
      .style.display = "none";


    document
      .getElementById("userText")
      .textContent =
      "👤 " + currentUser;

  }


  document
    .getElementById("loginButton")
    .addEventListener(
      "click",
      login
    );


  document
    .getElementById("loginCode")
    .addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {

          login();

        }

      }
    );


  /* ================= CHAT ================= */

  const messagesRef =
    ref(
      db,
      "rooms/azra-mirhan/messages"
    );


  document
    .getElementById("sendButton")
    .addEventListener(
      "click",
      sendMessage
    );


  document
    .getElementById("messageInput")
    .addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {

          sendMessage();

        }

      }
    );


  async function sendMessage() {

    const input =
      document.getElementById(
        "messageInput"
      );


    const text =
      input.value.trim();


    if (!text || !currentUser) {
      return;
    }


    await push(
      messagesRef,
      {

        user: currentUser,

        text: text,

        timestamp: Date.now()

      }
    );


    input.value = "";

  }


  onChildAdded(
    messagesRef,
    snapshot => {

      const data =
        snapshot.val();


      if (!data) return;


      const wrapper =
        document.createElement("div");


      wrapper.className =
        "message";


      if (
        data.user === currentUser
      ) {

        wrapper.classList.add("mine");

      }


      const name =
        document.createElement("span");


      name.className =
        "message-name";


      name.textContent =
        data.user;


      const text =
        document.createElement("span");


      text.className =
        "message-text";


      /*
        textContent kullanıyoruz.
        Böylece biri HTML kodu gönderirse
        sayfaya kod çalıştırılamaz.
      */

      text.textContent =
        data.text;


      const time =
        document.createElement("span");


      time.className =
        "message-time";


      if (data.timestamp) {

        time.textContent =
          new Date(
            data.timestamp
          ).toLocaleTimeString(
            "tr-TR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      wrapper.appendChild(name);

      wrapper.appendChild(text);

      wrapper.appendChild(time);


      const messages =
        document.getElementById(
          "messages"
        );


      messages.appendChild(wrapper);


      messages.scrollTop =
        messages.scrollHeight;

    }
  );


  /* ================= VIDEO ================= */

  const videoRef =
    ref(
      db,
      "rooms/azra-mirhan/video"
    );


  let player = null;

  let playerReady = false;

  /*
    Bu değişken çok önemli.

    Firebase'den gelen hareketi
    tekrar Firebase'e yazmamızı engeller.
  */

  let applyingRemote = false;


  /*
    Son Firebase verisini burada tutuyoruz.
  */

  let remoteVideo = null;


  /*
    Aynı videoyu tekrar tekrar
    loadVideoById yapmıyoruz.
  */

  let currentVideoId = "";


  /*
    Firebase'e gereksiz yere
    yüzlerce istek göndermemek için.
  */

  let lastWrite = 0;


  /* ================= YOUTUBE ================= */

  window.onYouTubeIframeAPIReady =
    function () {

      player =
        new YT.Player(
          "player",
          {

            width: "100%",

            height: "100%",

            videoId: "",

            playerVars: {

              autoplay: 0,

              controls: 1,

              rel: 0,

              modestbranding: 1,

              playsinline: 1

            },


            events: {

              onReady: function () {

                playerReady = true;

                setStatus(
                  "Hazır"
                );

              },


              onStateChange:
                function (event) {

                  /*
                    Firebase'den gelen
                    komutu geri yazma.
                  */

                  if (applyingRemote) {

                    return;

                  }


                  if (
                    event.data ===
                    YT.PlayerState.PLAYING
                  ) {

                    sendVideoState(
                      "playing"
                    );

                  }


                  if (
                    event.data ===
                    YT.PlayerState.PAUSED
                  ) {

                    sendVideoState(
                      "paused"
                    );

                  }

                }

            }

          }
        );

    };


  /* ================= YOUTUBE ID ================= */

  function getYoutubeId(url) {

    try {

      const parsed =
        new URL(url);


      /*
        youtube.com/watch?v=
      */

      if (
        parsed.hostname
          .includes("youtube.com")
      ) {

        return parsed
          .searchParams
          .get("v");

      }


      /*
        youtu.be/VIDEOID
      */

      if (
        parsed.hostname
          .includes("youtu.be")
      ) {

        return parsed
          .pathname
          .replace("/", "");

      }


      /*
        youtube.com/shorts/VIDEOID
      */

      if (
        parsed.pathname
          .startsWith("/shorts/")
      ) {

        return parsed
          .pathname
          .split("/")[2];

      }


    } catch (error) {

      return null;

    }


    return null;

  }


  /* ================= VİDEO AÇ ================= */

  document
    .getElementById("loadButton")
    .addEventListener(
      "click",
      loadVideo
    );


  async function loadVideo() {

    if (!playerReady) {

      alert(
        "YouTube henüz hazır değil."
      );

      return;

    }


    const url =
      document
        .getElementById(
          "youtubeUrl"
        )
        .value
        .trim();


    const videoId =
      getYoutubeId(url);


    if (!videoId) {

      alert(
        "Geçerli bir YouTube linki gir."
      );

      return;

    }


    /*
      Aynı videoyu tekrar yükleme.
    */

    if (
      currentVideoId === videoId
    ) {

      return;

    }


    currentVideoId =
      videoId;


    /*
      SADECE burada
      loadVideoById kullanıyoruz.
    */

    applyingRemote = true;


    player.loadVideoById(
      videoId
    );


    setTimeout(
      () => {

        applyingRemote = false;

        sendVideoState(
          "paused"
        );

      },
      700
    );

  }


  /* ================= PLAY ================= */

  document
    .getElementById("playButton")
    .addEventListener(
      "click",
      () => {

        if (!playerReady) return;

        player.playVideo();

      }
    );


  /* ================= PAUSE ================= */

  document
    .getElementById("pauseButton")
    .addEventListener(
      "click",
      () => {

        if (!playerReady) return;

        player.pauseVideo();

      }
    );


  /* ================= FIREBASE'E YAZ ================= */

  async function sendVideoState(
    state
  ) {

    if (
      !playerReady ||
      !currentUser ||
      applyingRemote
    ) {

      return;

    }


    const now =
      Date.now();


    /*
      Çok hızlı tekrar yazmayı engelle.
    */

    if (
      now - lastWrite < 300
    ) {

      return;

    }


    lastWrite = now;


    const data =
      player.getVideoData();


    if (
      !data ||
      !data.video_id
    ) {

      return;

    }


    currentVideoId =
      data.video_id;


    await set(
      videoRef,
      {

        videoId:
          data.video_id,

        time:
          player.getCurrentTime(),

        state:
          state,

        updatedAt:
          Date.now(),

        updatedBy:
          currentUser

      }
    );

  }


  /* ================= FIREBASE'DEN OKU ================= */

  onValue(
    videoRef,
    snapshot => {

      const data =
        snapshot.val();


      if (!data) {

        setStatus(
          "Video bekleniyor..."
        );

        return;

      }


      remoteVideo =
        data;


      if (!playerReady) {

        return;

      }


      if (!data.videoId) {

        return;

      }


      /*
        Video farklıysa sadece bir kez aç.
      */

      if (
        currentVideoId !==
        data.videoId
      ) {

        currentVideoId =
          data.videoId;


        applyingRemote = true;


        player.loadVideoById(
          data.videoId,
          data.time || 0
        );


        setTimeout(
          () => {

            applyRemoteState(
              data
            );

          },
          800
        );


        return;

      }


      /*
        Aynı videoysa
        tekrar loadVideoById YOK.
      */

      applyRemoteState(
        data
      );

    }
  );


  /* ================= UZAK DURUMU UYGULA ================= */

  function applyRemoteState(
    data
  ) {

    if (!playerReady) {

      return;

    }


    applyingRemote = true;


    const targetTime =
      Number(data.time || 0);


    const localTime =
      player.getCurrentTime();


    /*
      Sadece ciddi bir zaman farkı varsa
      seek yapıyoruz.

      Böylece video sürekli ileri-geri
      zıplamıyor.
    */

    if (
      Math.abs(
        localTime - targetTime
      ) > 2
    ) {

      player.seekTo(
        targetTime,
        true
      );

    }


    if (
      data.state === "playing"
    ) {

      /*
        Tarayıcı autoplay engellerse
        kullanıcı Play'e basabilir.
      */

      player.playVideo();

    }


    if (
      data.state === "paused"
    ) {

      player.pauseVideo();

    }


    setTimeout(
      () => {

        applyingRemote = false;

      },
      500
    );

  }


  /* ================= MANUEL SENKRON ================= */

  document
    .getElementById("syncButton")
    .addEventListener(
      "click",
      syncVideo
    );


  function syncVideo() {

    if (
      !playerReady ||
      !remoteVideo
    ) {

      return;

    }


    applyingRemote = true;


    /*
      Videonun farklı olması durumunda
      bir kere yükle.
    */

    if (
      currentVideoId !==
      remoteVideo.videoId
    ) {

      currentVideoId =
        remoteVideo.videoId;


      player.loadVideoById(
        remoteVideo.videoId,
        remoteVideo.time || 0
      );

    }

    else {

      player.seekTo(
        remoteVideo.time || 0,
        true
      );

    }


    setTimeout(
      () => {

        applyRemoteState(
          remoteVideo
        );

      },
      700
    );

  }


  /* ================= DURUM ================= */

  function setStatus(
    text
  ) {

    document
      .getElementById(
        "statusText"
      )
      .textContent = text;

  }


  /*
    Video ilerlerken zaman bilgisini
    periyodik olarak Firebase'e gönderiyoruz.

    2 saniyeden daha az fark varsa
    karşı tarafı sürekli seek etmiyoruz.
  */

  setInterval(
    () => {

      if (
        !playerReady ||
        applyingRemote ||
        !currentUser ||
        !player
      ) {

        return;

      }


      const state =
        player.getPlayerState();


      if (
        state ===
        YT.PlayerState.PLAYING
      ) {

        sendVideoState(
          "playing"
        );

      }

    },
    5000
  );


  setStatus(
    "Firebase bağlı"
  );

</script>

</body>
</html>
