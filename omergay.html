                /*

                    return;
                }

                if(!window.currentUser){
                    return;

                    YT.PlayerState.PLAYING

                }

                else if(

                }

            }
        }
    });
};

<script type="module">

/* =========================
   GLOBAL DEĞİŞKENLER

window.currentUser = null;

window.applyingRemote = false;

let currentVideoId = "";

let remoteVideo = null;

   DURUM

function login(){

}

/* Kayıtlı kullanıcı */

const savedUser =
    localStorage.getItem("film_user");


if(
    savedUser === "Ömer" ||

/* =========================
   CHAT
========================= */

const messagesRef =
    ref(
        db,
        "rooms/omer-arkadaslari/messages"
    );


async function sendMessage(){

    const input =
        document
            .getElementById(
                "messageInput"
            );


    const text =
        input.value.trim();


    if(
        !text ||
        !window.currentUser
    ){

        return;

    }


    await push(
        messagesRef,
        {

            user:
                window.currentUser,

            text:
                text,

            timestamp:
                Date.now()

        }
    );


    input.value = "";

    input.focus();

}


document
    .getElementById("sendButton")
    .addEventListener(
        "click",
        sendMessage
    );


document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                sendMessage();

            }

        }
    );


onChildAdded(
    messagesRef,
    function(snapshot){

        const data =
            snapshot.val();


        if(!data){
            return;
        }


        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "message";


        if(
            data.user ===
            window.currentUser
        ){

            wrapper.classList.add(
                "mine"
            );

        }


        const name =
            document.createElement(
                "span"
            );


        name.className =

            data.user;

        const time =

                "span"

            "message-time";


        if(data.timestamp){

                new Date(
                    data.timestamp

                    "tr-TR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }


        wrapper.appendChild(name);

        wrapper.appendChild(text);

        wrapper.appendChild(time);


        const messages =
            document.getElementById(
                "messages"
            );


        messages.appendChild(
            wrapper
        );


        messages.scrollTop =
            messages.scrollHeight;

    }
);


/* =========================
   YOUTUBE ID
========================= */

function getYoutubeId(url){

    try{

        const parsed =
            new URL(url);


        if(
            parsed.hostname
                .includes("youtu.be")
        ){

            return parsed
                .pathname
                .replace("/","");

        }


        if(
            parsed.hostname
                .includes("youtube.com")
        ){

            const v =
                parsed
                    .searchParams
                    .get("v");

            if(v){
                return v;
            }


            if(
                parsed.pathname
                    .startsWith("/shorts/")
            ){

                return parsed
                    .pathname
                    .split("/")[2];

            }

        }

    }
    catch(error){

        return null;

    }


    return null;

}


/* =========================
   VİDEO AÇ
========================= */

async function loadVideo(){

    if(!window.youtubeReady){

        alert(
            "YouTube henüz hazır değil. Birkaç saniye bekle."
        );

        return;

    }


    if(!window.youtubePlayer){

        alert(
            "YouTube oynatıcı oluşturulamadı."
        );

        return;

    }


    const url =
        document
            .getElementById(
                "youtubeUrl"
            )
            .value
            .trim();


    const videoId =
        getYoutubeId(url);


    if(!videoId){

        alert(
            "Geçerli bir YouTube linki gir."
        );

        return;

    }


    /*
        Aynı videoyu tekrar yükleme.
    */

    if(
        currentVideoId ===
        videoId
    ){

        return;

    }


    currentVideoId =
        videoId;


    window.applyingRemote =
        true;


    window.youtubePlayer
        .cueVideoById(
            videoId
        );


    setTimeout(
        function(){

            window.applyingRemote =
                false;


            sendVideoState(
                "paused"
            );

        },
        700
    );

}


document

/* =========================

========================= */

window.sendVideoState =
async function(state){

    if(
        !window.youtubeReady ||
        !window.youtubePlayer ||
        !window.currentUser ||
        window.applyingRemote
    ){

        return;

    }


    const now =
        Date.now();


    /*
        Aşırı Firebase isteğini engelle.
    */

    if(
        now - lastFirebaseWrite <
        500
    ){

        return;

    }


    lastFirebaseWrite =
        now;


    const videoData =
        window.youtubePlayer
            .getVideoData();


    if(
        !videoData ||
        !videoData.video_id
    ){

        return;

    }


    currentVideoId =
        videoData.video_id;


    await set(
        ref(
            db,
            "rooms/omer-arkadaslari/video"
        ),
        {

            videoId:
                videoData.video_id,

            time:
                window.youtubePlayer
                    .getCurrentTime(),

            state:
                state,

            updatedAt:
                Date.now(),

            updatedBy:
                window.currentUser

        }
    );

};


/* =========================
   FIREBASE VIDEO DİNLE
========================= */

const videoRef =
    ref(
        db,
        "rooms/omer-arkadaslari/video"
    );


onValue(
    videoRef,
    function(snapshot){

        const data =
            snapshot.val();


        if(!data){
            return;
        }


        remoteVideo =
            data;


        if(
            !window.youtubeReady ||
            !window.youtubePlayer
        ){

            return;

        }


        if(!data.videoId){

            return;

        }


        /*
            FARKLI VİDEOYSA SADECE BİR KEZ
            YÜKLE.
        */

        if(
            currentVideoId !==
            data.videoId
        ){

            currentVideoId =
                data.videoId;


            window.applyingRemote =
                true;


            window.youtubePlayer
                .cueVideoById(
                    data.videoId
                );


            setTimeout(
                function(){

                    applyRemoteState(
                        data
                    );

                },
                800
            );


            return;

        }


        /*
            Aynı videoysa tekrar yükleme.
        */

        applyRemoteState(
            data
        );

    }
);


/* =========================
   UZAK DURUM
========================= */

function applyRemoteState(data){

    if(
        !window.youtubeReady ||
        !window.youtubePlayer
    ){

        return;

    }


    window.applyingRemote =
        true;


    const targetTime =
        Number(
            data.time || 0
        );


    const localTime =
        window.youtubePlayer
            .getCurrentTime();


    /*
        2 saniyeden fazla fark varsa
        senkronla.
    */

    if(
        Math.abs(
            localTime -
            targetTime
        ) > 2
    ){

        window.youtubePlayer
            .seekTo(
                targetTime,
                true
            );

    }


    if(
        data.state ===
        "playing"
    ){

        window.youtubePlayer
            .playVideo();

    }


    else if(
        data.state ===
        "paused"
    ){

        window.youtubePlayer
            .pauseVideo();

    }


    setTimeout(
        function(){

            window.applyingRemote =
                false;

        },
        600
    );

}


/* =========================
   MANUEL SENKRON
========================= */

document
    .getElementById("syncButton")
    .addEventListener(
        "click",
        function(){

            if(
                !remoteVideo ||
                !window.youtubeReady
            ){

                return;

            }


            applyRemoteState(
                remoteVideo
            );

        }
    );


/* =========================
   HER 5 SANİYEDE SENKRON
========================= */

setInterval(
    function(){

        if(
            !window.youtubeReady ||
            !window.youtubePlayer ||
            !window.currentUser ||
            window.applyingRemote
        ){

            return;

        }


        const state =
            window.youtubePlayer
                .getPlayerState();


        if(
            state ===
            YT.PlayerState.PLAYING
        ){

            sendVideoState(
                "playing"
            );

        }

    },
    5000
);
